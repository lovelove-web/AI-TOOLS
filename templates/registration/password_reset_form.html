{% extends "base.html" %}
{% block title %}Reset Password — CSCT{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand"><i class="fa-solid fa-key"></i> Reset your password</div>
    <p class="text-muted small">Enter your account email and we'll send you a link to reset your password.</p>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-brand w-100">Send reset link</button>
    </form>
  </div>
</div>
{% endblock %}
