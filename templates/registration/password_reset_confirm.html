{% extends "base.html" %}
{% block auth_content %}
<div class="auth-wrapper"><div class="auth-card">
  <div class="auth-brand"><i class="fa-solid fa-lock"></i> Set a new password</div>
  {% if validlink %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3"><label class="form-label">New password</label>
      <input type="password" name="new_password1" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Confirm new password</label>
      <input type="password" name="new_password2" class="form-control" required></div>
    <button type="submit" class="btn btn-brand w-100">Reset password</button>
  </form>
  {% else %}
  <p class="text-danger">This password reset link is invalid or has expired.</p>
  <a href="{% url 'accounts:password_reset' %}" class="btn btn-brand w-100">Request a new link</a>
  {% endif %}
</div></div>
{% endblock %}
