<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Breakout</title>
<style>
  /* ===================== Basic page styling ===================== */
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0e14;
    color: #eaf6ff;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden; /* prevent page scroll while playing on mobile */
    touch-action: none; /* stop browser gestures (scroll/zoom) from stealing touches */
  }

  #game-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 10px;
  }

  /* HUD showing score / lives / level above the canvas */
  #hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 640px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 6px;
    padding: 0 4px;
  }
  #hud span { color: #7ef9ff; }

  canvas {
    background: #05070c;
    border: 3px solid #2f81ff;
    border-radius: 8px;
    box-shadow: 0 0 25px rgba(47, 129, 255, 0.45);
    max-width: 100%;
    max-height: 78vh;
    touch-action: none;
  }

  /* Mobile on-screen paddle controls (shown only on touch devices) */
  #touch-controls {
    display: none;
    width: 100%;
    max-width: 640px;
    justify-content: space-between;
    margin-top: 10px;
    gap: 10px;
  }
  #touch-controls button {
    flex: 1;
    padding: 16px 0;
    font-size: 22px;
    background: #14203a;
    color: #7ef9ff;
    border: 2px solid #2f81ff;
    border-radius: 8px;
    user-select: none;
  }
  #touch-controls button:active { background: #2f81ff; color: #05070c; }

  /* Overlay screens: start / pause / game over / victory */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 7, 12, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 42px; margin: 0 0 10px; color: #7ef9ff; text-shadow: 0 0 12px rgba(126,249,255,.7); }
  #overlay p { font-size: 18px; max-width: 480px; line-height: 1.5; color: #cfe8ff; }
  #overlay button {
    margin-top: 20px;
    padding: 14px 34px;
    font-size: 18px;
    font-weight: bold;
    background: #2f81ff;
    color: #05070c;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(47,129,255,.7);
  }
  #overlay button:hover { background: #7ef9ff; }

  @media (hover: none) and (pointer: coarse) {
    /* Show touch buttons only on touch-capable devices */
    #touch-controls { display: flex; }
  }
</style>
</head>
<body>

  <div id="game-wrap">
    <!-- Heads-up display: score, lives, level -->
    <div id="hud">
      <div>SCORE: <span id="score">0</span></div>
      <div>LEVEL: <span id="level">1</span></div>
      <div>LIVES: <span id="lives">3</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- On-screen left/right buttons for mobile paddle control -->
    <div id="touch-controls">
      <button id="btnLeft">&#9664; LEFT</button>
      <button id="btnRight">RIGHT &#9654;</button>
    </div>
  </div>

  <!-- Overlay used for Start / Pause / Game Over / Victory messages -->
  <div id="overlay">
    <h1 id="overlayTitle">BREAKOUT</h1>
    <p id="overlayText">Use the mouse, arrow keys, or on-screen buttons to move the paddle.
      Break every brick without losing all your lives!</p>
    <button id="overlayBtn">START GAME</button>
  </div>

<script>
/* =====================================================================
   BREAKOUT — HTML5 Canvas Arcade Game
   ---------------------------------------------------------------------
   Structure:
     1. Setup & responsive canvas sizing
     2. Game state (score, lives, level, entities)
     3. Entity builders (paddle, ball, bricks)
     4. Input handling (keyboard, mouse, touch)
     5. Physics & collision detection
     6. Rendering
     7. Main loop + win/lose flow
   ===================================================================== */

// ---------------------------------------------------------------------
// 1. SETUP & RESPONSIVE CANVAS
// ---------------------------------------------------------------------
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Design-resolution constants. The canvas is drawn at this fixed internal
// resolution, then scaled to fit the screen via CSS (max-width/max-height)
// so the game logic never has to worry about different device sizes.
const BASE_WIDTH = 640;
const BASE_HEIGHT = 480;
canvas.width = BASE_WIDTH;
canvas.height = BASE_HEIGHT;

// ---------------------------------------------------------------------
// 2. GAME STATE
// ---------------------------------------------------------------------
const state = {
  score: 0,
  lives: 3,
  level: 1,
  running: false,   // true while the game loop is actively updating
  paused: false,
  ballLaunched: false // ball sticks to paddle until launched
};

// DOM references for the HUD, updated whenever values change
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const levelEl = document.getElementById('level');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const overlayBtn = document.getElementById('overlayBtn');

function updateHud() {
  scoreEl.textContent = state.score;
  livesEl.textContent = state.lives;
  levelEl.textContent = state.level;
}

// ---------------------------------------------------------------------
// 3. ENTITIES
// ---------------------------------------------------------------------

// --- Paddle -----------------------------------------------------------
const paddle = {
  width: 100,
  height: 14,
  x: (BASE_WIDTH - 100) / 2,
  y: BASE_HEIGHT - 30,
  speed: 7,          // pixels per frame when using keyboard/buttons
  movingLeft: false,
  movingRight: false
};

// --- Ball ---------------------------------------------------------------
const ball = {
  radius: 8,
  x: BASE_WIDTH / 2,
  y: paddle.y - 8 - 1,
  speed: 4.5,        // base scalar speed, increases slightly each level
  dx: 0,
  dy: 0
};

// Resets the ball onto the paddle (used at game start and after losing a life)
function resetBall() {
  state.ballLaunched = false;
  ball.x = paddle.x + paddle.width / 2;
  ball.y = paddle.y - ball.radius - 1;
  ball.dx = 0;
  ball.dy = 0;
}

// Launches the ball at a fixed upward angle
function launchBall() {
  if (state.ballLaunched) return;
  state.ballLaunched = true;
  const angle = (Math.PI / 180) * (60 + Math.random() * 60); // 60°-120° spread
  ball.dx = ball.speed * Math.cos(angle) * (Math.random() < 0.5 ? -1 : 1);
  ball.dy = -Math.abs(ball.speed * Math.sin(angle));
}

// --- Bricks -------------------------------------------------------------
const brickConfig = {
  rows: 5,
  cols: 8,
  width: 64,
  height: 20,
  padding: 6,
  offsetTop: 50,
  offsetLeft: 0 // computed below once we know total grid width
};
// Center the brick grid horizontally
brickConfig.offsetLeft = (BASE_WIDTH - (brickConfig.cols * (brickConfig.width + brickConfig.padding) - brickConfig.padding)) / 2;

// Row colors — also determine point value (top rows worth more)
const rowColors = ['#ff4d6d', '#ff9a3d', '#ffe14d', '#7bff6b', '#4dd2ff'];
const rowPoints  = [50, 40, 30, 20, 10];

let bricks = []; // 2D array: bricks[row][col] = { x, y, active }

// Builds a fresh brick grid. Called at game start and every new level.
function buildBricks() {
  bricks = [];
  for (let r = 0; r < brickConfig.rows; r++) {
    bricks[r] = [];
    for (let c = 0; c < brickConfig.cols; c++) {
      const x = brickConfig.offsetLeft + c * (brickConfig.width + brickConfig.padding);
      const y = brickConfig.offsetTop + r * (brickConfig.height + brickConfig.padding);
      bricks[r][c] = { x, y, active: true };
    }
  }
}

// ---------------------------------------------------------------------
// 4. INPUT HANDLING
// ---------------------------------------------------------------------

// --- Keyboard -----------------------------------------------------------
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') paddle.movingLeft = true;
  if (e.key === 'ArrowRight' || e.key === 'd') paddle.movingRight = true;
  if (e.key === ' ') { launchBall(); e.preventDefault(); }
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') paddle.movingLeft = false;
  if (e.key === 'ArrowRight' || e.key === 'd') paddle.movingRight = false;
});

// --- Mouse (desktop) ------------------------------------------------------
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scale = BASE_WIDTH / rect.width; // account for CSS scaling of canvas
  const mouseX = (e.clientX - rect.left) * scale;
  movePaddleTo(mouseX);
});
canvas.addEventListener('click', launchBall);

// --- Touch (mobile: drag directly on canvas) -------------------------------
canvas.addEventListener('touchstart', handleTouch, { passive: false });
canvas.addEventListener('touchmove', handleTouch, { passive: false });
function handleTouch(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scale = BASE_WIDTH / rect.width;
  const touchX = (e.touches[0].clientX - rect.left) * scale;
  movePaddleTo(touchX);
  launchBall();
}

// --- On-screen buttons (mobile fallback controls) --------------------------
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
function bindHoldButton(btn, onFlag) {
  const start = (e) => { e.preventDefault(); onFlag(true); };
  const end = (e) => { e.preventDefault(); onFlag(false); };
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend', end);
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('mouseleave', end);
}
bindHoldButton(btnLeft, (v) => paddle.movingLeft = v);
bindHoldButton(btnRight, (v) => paddle.movingRight = v);

// Helper: move paddle center to a target x position, clamped to canvas bounds
function movePaddleTo(targetX) {
  paddle.x = targetX - paddle.width / 2;
  clampPaddle();
}
function clampPaddle() {
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.width > BASE_WIDTH) paddle.x = BASE_WIDTH - paddle.width;
}

// ---------------------------------------------------------------------
// 5. PHYSICS & COLLISION
// ---------------------------------------------------------------------

function updatePaddle() {
  if (paddle.movingLeft) paddle.x -= paddle.speed;
  if (paddle.movingRight) paddle.x += paddle.speed;
  clampPaddle();

  // If the ball hasn't launched yet, keep it glued to the paddle
  if (!state.ballLaunched) {
    ball.x = paddle.x + paddle.width / 2;
  }
}

function updateBall() {
  if (!state.ballLaunched) return;

  ball.x += ball.dx;
  ball.y += ball.dy;

  // Wall collisions (left/right/top) — simple reflection
  if (ball.x - ball.radius < 0) {
    ball.x = ball.radius;
    ball.dx *= -1;
  } else if (ball.x + ball.radius > BASE_WIDTH) {
    ball.x = BASE_WIDTH - ball.radius;
    ball.dx *= -1;
  }
  if (ball.y - ball.radius < 0) {
    ball.y = ball.radius;
    ball.dy *= -1;
  }

  // Paddle collision — bounce angle depends on WHERE the ball hit the paddle,
  // giving the player control over the rebound direction (classic Breakout feel)
  if (
    ball.y + ball.radius >= paddle.y &&
    ball.y + ball.radius <= paddle.y + paddle.height &&
    ball.x >= paddle.x &&
    ball.x <= paddle.x + paddle.width &&
    ball.dy > 0
  ) {
    const hitPos = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2); // -1 (far left) to 1 (far right)
    const maxBounceAngle = (75 * Math.PI) / 180; // clamp so ball never goes near-flat
    const angle = hitPos * maxBounceAngle;
    const speed = Math.hypot(ball.dx, ball.dy); // preserve current speed magnitude
    ball.dx = speed * Math.sin(angle);
    ball.dy = -Math.abs(speed * Math.cos(angle));
    ball.y = paddle.y - ball.radius; // avoid sinking into the paddle
  }

  // Bottom edge — lose a life
  if (ball.y - ball.radius > BASE_HEIGHT) {
    loseLife();
  }

  // Brick collisions
  checkBrickCollisions();
}

// Axis-aligned bounding box check between the ball and each active brick
function checkBrickCollisions() {
  for (let r = 0; r < brickConfig.rows; r++) {
    for (let c = 0; c < brickConfig.cols; c++) {
      const b = bricks[r][c];
      if (!b.active) continue;

      if (
        ball.x + ball.radius > b.x &&
        ball.x - ball.radius < b.x + brickConfig.width &&
        ball.y + ball.radius > b.y &&
        ball.y - ball.radius < b.y + brickConfig.height
      ) {
        b.active = false;
        state.score += rowPoints[r];
        updateHud();

        // Determine bounce direction by comparing overlap depth on each axis,
        // so the ball reflects correctly whether it hit a side, top, or bottom
        const overlapLeft = (ball.x + ball.radius) - b.x;
        const overlapRight = (b.x + brickConfig.width) - (ball.x - ball.radius);
        const overlapTop = (ball.y + ball.radius) - b.y;
        const overlapBottom = (b.y + brickConfig.height) - (ball.y - ball.radius);
        const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

        if (minOverlap === overlapTop || minOverlap === overlapBottom) {
          ball.dy *= -1;
        } else {
          ball.dx *= -1;
        }

        checkVictory();
        return; // handle only one brick per frame to avoid double bounces
      }
    }
  }
}

function loseLife() {
  state.lives--;
  updateHud();
  if (state.lives <= 0) {
    endGame(false);
  } else {
    resetBall();
  }
}

function checkVictory() {
  const anyLeft = bricks.some(row => row.some(b => b.active));
  if (!anyLeft) {
    nextLevel();
  }
}

// Advances to a new, slightly harder level once all bricks are cleared
function nextLevel() {
  state.level++;
  ball.speed += 0.5; // ramp difficulty
  updateHud();
  buildBricks();
  resetBall();
  showOverlay(
    'LEVEL ' + state.level + '!',
    'Great job clearing the bricks. Get ready for a faster ball.',
    'CONTINUE'
  );
  state.running = false;
}

// ---------------------------------------------------------------------
// 6. RENDERING
// ---------------------------------------------------------------------

function draw() {
  ctx.clearRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
  drawBricks();
  drawPaddle();
  drawBall();
}

function drawBricks() {
  for (let r = 0; r < brickConfig.rows; r++) {
    for (let c = 0; c < brickConfig.cols; c++) {
      const b = bricks[r][c];
      if (!b.active) continue;
      ctx.fillStyle = rowColors[r];
      ctx.fillRect(b.x, b.y, brickConfig.width, brickConfig.height);
      // subtle inner highlight for a 3D "arcade" look
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(b.x, b.y, brickConfig.width, 4);
    }
  }
}

function drawPaddle() {
  const grad = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.width, 0);
  grad.addColorStop(0, '#2f81ff');
  grad.addColorStop(1, '#7ef9ff');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 6);
  ctx.fill();
}

function drawBall() {
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fillStyle = '#ffe14d';
  ctx.shadowColor = '#ffe14d';
  ctx.shadowBlur = 12;
  ctx.fill();
  ctx.shadowBlur = 0;
}

// ---------------------------------------------------------------------
// 7. MAIN LOOP + GAME FLOW
// ---------------------------------------------------------------------

function loop() {
  if (state.running && !state.paused) {
    updatePaddle();
    updateBall();
    draw();
  }
  requestAnimationFrame(loop);
}

function startGame() {
  state.score = 0;
  state.lives = 3;
  state.level = 1;
  ball.speed = 4.5;
  updateHud();
  buildBricks();
  resetBall();
  hideOverlay();
  state.running = true;
}

function endGame(won) {
  state.running = false;
  if (won) {
    showOverlay('YOU WIN!', 'You cleared every brick with a final score of ' + state.score + '. Nice reflexes!', 'PLAY AGAIN');
  } else {
    showOverlay('GAME OVER', 'You ran out of lives. Final score: ' + state.score + '. Give it another shot!', 'TRY AGAIN');
  }
}

// Special-case victory when the player clears the very last level's bricks
// and we don't want to just keep ramping forever — after 3 levels, declare a win.
const MAX_LEVEL = 3;
function checkVictoryOverride() {
  if (state.level > MAX_LEVEL) {
    endGame(true);
  }
}

function showOverlay(title, text, btnLabel) {
  overlayTitle.textContent = title;
  overlayText.textContent = text;
  overlayBtn.textContent = btnLabel;
  overlay.classList.remove('hidden');
}
function hideOverlay() {
  overlay.classList.add('hidden');
}

// Overlay button drives all game-state transitions: start, next level, restart
overlayBtn.addEventListener('click', () => {
  if (state.level > MAX_LEVEL) {
    startGame(); // restart from level 1 after winning
  } else if (!state.running && state.lives > 0 && overlayTitle.textContent.startsWith('LEVEL')) {
    hideOverlay();
    state.running = true; // resume into the new level
  } else {
    startGame();
  }
});

// Wrap nextLevel's win condition: once level exceeds MAX_LEVEL, trigger true victory
const originalNextLevel = nextLevel;
nextLevel = function () {
  state.level++;
  if (state.level > MAX_LEVEL) {
    endGame(true);
    return;
  }
  ball.speed += 0.5;
  updateHud();
  buildBricks();
  resetBall();
  showOverlay(
    'LEVEL ' + state.level + '!',
    'Great job clearing the bricks. Get ready for a faster ball.',
    'CONTINUE'
  );
  state.running = false;
};

// Kick off the render loop immediately (game stays idle until Start is pressed)
buildBricks();
resetBall();
updateHud();
requestAnimationFrame(loop);
</script>
</body>
</html>
